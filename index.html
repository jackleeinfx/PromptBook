<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Manager</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createClient } = supabase;

                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            ),

                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            ),
            Copy: ({ size = 24, className = "" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            ),
            X: ({ size = 24, className = "" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            ),
            Settings: ({ size = 24, className = "" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            ),
            Check: ({ size = 24, className = "" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>
            ),
            Pin: ({ size = 24, className = "" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
            ),
            Image: ({ size = 24, className = "" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            ),
            Grid: ({ size = 24, className = "" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            )
        };

        // --- Category Manager ---
        function CategoryManager({ supabase, onCategoriesChange }) {
            const [categories, setCategories] = useState([]);
            const [newCategory, setNewCategory] = useState('');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if(supabase) fetchCategories();
            }, [supabase]);

            async function fetchCategories() {
                const { data, error } = await supabase
                    .from('categories')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (error) {
                    console.error('Error fetching categories:', error);
                } else {
                    setCategories(data);
                    if (onCategoriesChange) onCategoriesChange(data);
                }
            }

            async function addCategory() {
                if (!newCategory.trim()) return;
                setLoading(true);
                const { error } = await supabase
                    .from('categories')
                    .insert([{ name: newCategory.trim() }]);

                if (error) {
                    alert('Error adding category: ' + error.message);
                } else {
                    setNewCategory('');
                    fetchCategories();
                }
                setLoading(false);
            }

            async function deleteCategory(id) {
                if (!window.confirm('Are you sure you want to delete this category and all its prompts?')) return;

                const { error } = await supabase
                    .from('categories')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert('Error deleting category: ' + error.message);
                } else {
                    fetchCategories();
                }
            }

            return (
                <div className="bg-gray-800 p-4 rounded-lg shadow mb-6 border border-gray-700">
                    <h2 className="text-xl font-bold mb-4 text-gray-100">Category Manager</h2>

                    <div className="flex gap-2 mb-4">
                        <input
                            type="text"
                            value={newCategory}
                            onChange={(e) => setNewCategory(e.target.value)}
                            placeholder="New Category Name (e.g. Style, Camera)"
                            className="flex-1 p-2 border border-gray-600 bg-gray-700 text-gray-100 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400"
                            onKeyDown={(e) => e.key === 'Enter' && addCategory()}
                        />
                        <button
                            onClick={addCategory}
                            disabled={loading}
                            className="bg-blue-600 text-white px-4 py-2 rounded flex items-center gap-2 hover:bg-blue-700 disabled:opacity-50 transition-colors"
                        >
                            <Icons.Plus size={16} /> Add
                        </button>
                    </div>

                    <div className="flex flex-wrap gap-2">
                        {categories.map((cat) => (
                            <div key={cat.id} className="flex items-center gap-2 bg-gray-700 px-3 py-1 rounded-full border border-gray-600">
                                <span className="font-medium text-gray-200">{cat.name}</span>
                                <button
                                    onClick={() => deleteCategory(cat.id)}
                                    className="text-gray-400 hover:text-red-500 transition-colors"
                                    title="Delete Category"
                                >
                                    <Icons.Trash2 size={14} />
                                </button>
                            </div>
                        ))}
                        {categories.length === 0 && <p className="text-gray-500 text-sm italic">No categories created yet.</p>}
                    </div>
                </div>
            );
        }

        // --- Template Gallery ---
        function TemplateGallery({ supabase, onAddPrompt }) {
            const [templates, setTemplates] = useState([]);
            const [showForm, setShowForm] = useState(false);
            const [newTemplate, setNewTemplate] = useState({ content: '', image_url: '' });
            const [uploading, setUploading] = useState(false);

            useEffect(() => {
                if(supabase) fetchTemplates();
            }, [supabase]);

            async function fetchTemplates() {
                const { data, error } = await supabase
                    .from('templates')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('Error fetching templates:', error);
                    // Handle potential missing table if user hasn't run schema update
                    if (error.code === '42P01') {
                        alert("The 'templates' table is missing. Please update your schema.");
                    }
                } else {
                    setTemplates(data || []);
                }
            }

            async function compressImage(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const maxSize = 800; // Initial scaling limit

                            if (width > height) {
                                if (width > maxSize) {
                                    height = Math.round(height * (maxSize / width));
                                    width = maxSize;
                                }
                            } else {
                                if (height > maxSize) {
                                    width = Math.round(width * (maxSize / height));
                                    height = maxSize;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            let quality = 0.8;

                            const compress = () => {
                                canvas.toBlob((blob) => {
                                    if (blob.size < 100 * 1024 || quality < 0.1) {
                                        resolve(blob);
                                    } else {
                                        quality -= 0.1;
                                        compress();
                                    }
                                }, 'image/jpeg', quality);
                            };
                            compress();
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            async function handleImageUpload(file) {
                if (!file) return;

                setUploading(true);
                try {
                    const compressedBlob = await compressImage(file);
                    const filename = `${Date.now()}-${file.name}`;

                    const { data, error } = await supabase
                        .storage
                        .from('images')
                        .upload(filename, compressedBlob);

                    if (error) throw error;

                    const { data: publicUrlData } = supabase
                        .storage
                        .from('images')
                        .getPublicUrl(filename);

                    setNewTemplate(prev => ({ ...prev, image_url: publicUrlData.publicUrl }));
                } catch (error) {
                    alert('Upload failed: ' + error.message);
                } finally {
                    setUploading(false);
                }
            }

            // Drag & Drop Handler
            function handleDrop(e) {
                e.preventDefault();
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    handleImageUpload(file);
                }
            }

            // Paste Handler
            function handlePaste(e) {
                const items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].kind === 'file' && items[i].type.startsWith('image/')) {
                        const file = items[i].getAsFile();
                        handleImageUpload(file);
                        return; // Only process the first image
                    }
                }
            }

            async function addTemplate() {
                if (!newTemplate.content) return;

                const { error } = await supabase
                    .from('templates')
                    .insert([newTemplate]);

                if (error) {
                    alert('Error adding template: ' + error.message);
                } else {
                    setNewTemplate({ content: '', image_url: '' });
                    setShowForm(false);
                    fetchTemplates();
                }
            }

            async function deleteTemplate(id) {
                if(!confirm("Delete this template?")) return;
                const { error } = await supabase.from('templates').delete().eq('id', id);
                if(error) alert(error.message);
                else fetchTemplates();
            }

            return (
                <div className="flex-1 bg-gray-800 p-4 rounded-lg shadow border border-gray-700 h-[calc(100vh-140px)] overflow-y-auto">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-bold text-gray-100 flex items-center gap-2"><Icons.Grid /> Template Gallery</h2>
                        <button
                            onClick={() => setShowForm(!showForm)}
                            className="bg-blue-600 text-white px-3 py-1.5 rounded flex items-center gap-2 text-sm hover:bg-blue-700"
                        >
                            {showForm ? <Icons.X size={16}/> : <Icons.Plus size={16}/>}
                            {showForm ? 'Cancel' : 'New Template'}
                        </button>
                    </div>

                    {showForm && (
                        <div
                            className="bg-gray-700 p-4 rounded mb-4 border border-gray-600"
                            onDragOver={(e) => e.preventDefault()}
                            onDrop={handleDrop}
                            onPaste={handlePaste}
                        >
                            <h3 className="font-bold mb-2 text-gray-200">Create New Template</h3>
                            <div className="space-y-3">
                                <div className="border-2 border-dashed border-gray-500 rounded p-4 text-center hover:border-blue-500 transition-colors">
                                    <p className="text-xs text-gray-400 mb-2">Drag & Drop Image, Paste from Clipboard, or Select File</p>
                                    <input
                                        type="file"
                                        accept="image/*"
                                        onChange={(e) => handleImageUpload(e.target.files[0])}
                                        disabled={uploading}
                                        className="text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer"
                                    />
                                    {uploading && <div className="mt-2 text-xs text-yellow-400">Compressing & Uploading...</div>}
                                    {newTemplate.image_url && (
                                        <div className="mt-2">
                                            <span className="text-xs text-green-400">Image Ready!</span>
                                            <img src={newTemplate.image_url} alt="Preview" className="h-16 mt-1 rounded border border-gray-600 mx-auto" />
                                        </div>
                                    )}
                                </div>
                                <textarea
                                    placeholder="Prompt Content (Required)"
                                    value={newTemplate.content}
                                    onChange={e => setNewTemplate({...newTemplate, content: e.target.value})}
                                    className="w-full p-2 rounded bg-gray-800 border border-gray-600 text-gray-100 text-sm min-h-[100px]"
                                />
                                <button
                                    onClick={addTemplate}
                                    disabled={uploading}
                                    className="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700 disabled:opacity-50"
                                >
                                    Save Template
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        {templates.map(t => (
                            <div key={t.id} className="bg-gray-700 rounded border border-gray-600 overflow-hidden group relative flex flex-col">
                                {t.image_url ? (
                                    <div
                                        className="h-32 bg-gray-900 bg-cover bg-center cursor-pointer"
                                        style={{backgroundImage: `url(${t.image_url})`}}
                                        onClick={() => onAddPrompt(t.content)}
                                    />
                                ) : (
                                    <div
                                        className="h-32 bg-gray-800 flex items-center justify-center text-gray-500 cursor-pointer"
                                        onClick={() => onAddPrompt(t.content)}
                                    >
                                        <Icons.Image size={32} />
                                    </div>
                                )}
                                <div className="p-2 flex-1 flex flex-col">
                                    <div className="text-xs text-gray-300 line-clamp-4 mb-2 flex-1 whitespace-pre-wrap">{t.content}</div>
                                    <button
                                        onClick={() => onAddPrompt(t.content)}
                                        className="w-full bg-blue-600/20 text-blue-300 py-1 rounded text-xs hover:bg-blue-600/40 transition-colors"
                                    >
                                        Add to Output
                                    </button>
                                </div>
                                <button
                                    onClick={() => deleteTemplate(t.id)}
                                    className="absolute top-1 right-1 bg-red-900/80 text-white p-1 rounded opacity-0 group-hover:opacity-100 transition-opacity"
                                >
                                    <Icons.Trash2 size={12} />
                                </button>
                            </div>
                        ))}
                        {templates.length === 0 && !showForm && (
                            <div className="col-span-full text-center text-gray-500 py-10">
                                No templates yet. Create one to get started!
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- Output Panel (Shared) ---
        function OutputPanel({ selectedPrompts, removeSelected, clearAll, copyToClipboard, copySuccess }) {
            return (
                <div className="w-full md:w-1/4 bg-gray-800 p-4 rounded-lg shadow flex flex-col border border-gray-700">
                    <div className="flex justify-between items-center mb-2">
                        <h3 className="font-bold text-gray-200">Output</h3>
                        <button onClick={clearAll} className="text-xs text-red-400 hover:underline">Clear All</button>
                    </div>

                    <div className="flex-1 bg-gray-900 border border-gray-700 rounded p-2 overflow-y-auto mb-2 min-h-[100px]">
                        <div className="flex flex-wrap gap-1">
                            {selectedPrompts.map((p, i) => (
                                <span key={i} className="bg-blue-900 text-blue-100 text-xs px-2 py-1 rounded flex items-center gap-1 border border-blue-800">
                                    {p}
                                    <button onClick={() => removeSelected(i)} className="hover:text-red-400"><Icons.X size={10} /></button>
                                </span>
                            ))}
                            {selectedPrompts.length === 0 && <span className="text-gray-500 italic text-sm">Selected prompts will appear here...</span>}
                        </div>
                    </div>

                    <div className="mb-2">
                        <textarea
                            className="w-full h-24 p-2 text-sm border border-gray-600 bg-gray-700 text-gray-100 rounded font-mono focus:outline-none focus:ring-1 focus:ring-blue-500"
                            readOnly
                            value={selectedPrompts.join(', ')}
                        />
                    </div>

                    <button
                        onClick={copyToClipboard}
                        disabled={selectedPrompts.length === 0}
                        className={`w-full py-2 rounded flex items-center justify-center gap-2 disabled:opacity-50 transition-colors ${copySuccess ? 'bg-green-600 hover:bg-green-700 text-white' : 'bg-blue-600 hover:bg-blue-700 text-white'}`}
                    >
                        {copySuccess ? <><Icons.Check size={16} /> Copied!</> : <><Icons.Copy size={16} /> Copy Prompts</>}
                    </button>
                </div>
            );
        }

        // --- Bulk Importer ---
        function BulkImporter({ supabase, categories, onImportComplete }) {
            const [text, setText] = useState('');
            const [loading, setLoading] = useState(false);
            const textareaRef = React.useRef(null);

            useEffect(() => {
                if (textareaRef.current) {
                    textareaRef.current.style.height = 'auto';
                    textareaRef.current.style.height = textareaRef.current.scrollHeight + 'px';
                }
            }, [text]);

            async function handleSave() {
                if (!text.trim()) {
                    alert('Please enter some prompts.');
                    return;
                }

                setLoading(true);

                let targetCategoryId = null;
                const pendingName = "待定";

                // Always try to find or create "待定"
                const existing = categories.find(c => c.name === pendingName);

                if (existing) {
                    targetCategoryId = existing.id;
                } else {
                    // Create it
                    const { data: newCat, error: createError } = await supabase.from('categories').insert([{ name: pendingName }]).select().single();
                    if (createError) {
                        alert('Error creating default category: ' + createError.message);
                        setLoading(false);
                        return;
                    }
                    targetCategoryId = newCat.id;
                }

                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

                if (lines.length === 0) {
                    setLoading(false);
                    return;
                }

                const rows = lines.map(line => ({
                    content: line,
                    category_id: targetCategoryId
                }));

                const { error } = await supabase
                    .from('prompts')
                    .insert(rows);

                if (error) {
                    alert('Error importing prompts: ' + error.message);
                } else {
                    alert(`Successfully imported ${lines.length} prompts to "待定"!`);
                    setText('');
                    if (onImportComplete) onImportComplete();
                }
                setLoading(false);
            }

            return (
                <div className="bg-gray-800 p-4 rounded-lg shadow mb-6 border border-gray-700">
                    <h2 className="text-xl font-bold mb-4 text-gray-100">Bulk Import Prompts</h2>

                    <p className="mb-4 text-sm text-gray-400">
                        Prompts will be automatically added to the <span className="font-bold text-gray-200">待定</span> category.
                    </p>

                    <div className="mb-4">
                        <label className="block text-sm font-medium text-gray-300 mb-1">Prompts (One per line)</label>
                        <textarea
                            ref={textareaRef}
                            value={text}
                            onChange={(e) => setText(e.target.value)}
                            placeholder="Paste multiple prompts here..."
                            className="w-full p-2 border border-gray-600 bg-gray-700 text-gray-100 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm placeholder-gray-400 overflow-hidden min-h-[300px]"
                        />
                    </div>

                    <button
                        onClick={handleSave}
                        disabled={loading}
                        className="bg-green-600 text-white px-4 py-2 rounded flex items-center gap-2 hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors w-full justify-center"
                    >
                        <Icons.Save size={16} /> Save Prompts
                    </button>
                </div>
            );
        }

        // --- Prompt Builder ---
        function PromptBuilder({ supabase, categories, selectedPrompts, addPrompt, removeSelected, clearAll, copyToClipboard, copySuccess }) {
            const [activeCategoryId, setActiveCategoryId] = useState(null);
            const [prompts, setPrompts] = useState([]);
            const [draggedPrompt, setDraggedPrompt] = useState(null);

            useEffect(() => {
                if (activeCategoryId && supabase) {
                    fetchPrompts(activeCategoryId);
                } else {
                    setPrompts([]);
                }
            }, [activeCategoryId, supabase]);

            async function fetchPrompts(catId) {
                // Try fetching with pinned sorting
                let query = supabase
                    .from('prompts')
                    .select('*')
                    .eq('category_id', catId)
                    .order('is_pinned', { ascending: false })
                    .order('id', { ascending: true });

                let { data, error } = await query;

                if (error) {
                    // Fallback: If 'is_pinned' column doesn't exist, fetch without it
                    console.warn('Error fetching prompts with pin sort, retrying without:', error);
                    const fallback = await supabase
                        .from('prompts')
                        .select('*')
                        .eq('category_id', catId)
                        .order('id', { ascending: true });

                    data = fallback.data;
                    error = fallback.error;
                }

                if (error) {
                    console.error('Error fetching prompts:', error);
                } else {
                    setPrompts(data);
                }
            }

            async function togglePin(e, prompt) {
                e.stopPropagation(); // Don't add to selection

                const newStatus = !prompt.is_pinned;

                // Optimistic update
                setPrompts(prompts.map(p =>
                    p.id === prompt.id ? { ...p, is_pinned: newStatus } : p
                ).sort((a, b) => {
                    // Re-sort locally
                    if (a.is_pinned === b.is_pinned) return a.id - b.id;
                    return a.is_pinned ? -1 : 1;
                }));

                const { error } = await supabase
                    .from('prompts')
                    .update({ is_pinned: newStatus })
                    .eq('id', prompt.id);

                if (error) {
                    console.error("Error pinning prompt:", error);
                    alert("Failed to pin prompt. Your database might need an update to support pinning.");
                    fetchPrompts(activeCategoryId); // Revert UI
                }
            }

            // Drag and Drop Logic
            function handleDragStart(e, prompt) {
                setDraggedPrompt(prompt);
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', JSON.stringify(prompt));
            }

            function handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            }

            async function handleDrop(e, targetCategoryId) {
                e.preventDefault();
                if (!draggedPrompt) return;

                if (draggedPrompt.category_id === targetCategoryId) return;

                setPrompts(prompts.filter(p => p.id !== draggedPrompt.id));

                const { error } = await supabase
                    .from('prompts')
                    .update({ category_id: targetCategoryId })
                    .eq('id', draggedPrompt.id);

                if (error) {
                    alert('Error moving prompt: ' + error.message);
                } else {
                    setPrompts(prompts.filter(p => p.id !== draggedPrompt.id));
                    setDraggedPrompt(null);
                }
            }

            // Mobile "Move" Logic
            const [mobileMoveTarget, setMobileMoveTarget] = useState(null);

            function openMobileMove(e, prompt) {
                e.stopPropagation();
                e.preventDefault();
                setMobileMoveTarget(prompt);
            }

            async function confirmMobileMove(targetCatId) {
                if (!mobileMoveTarget) return;

                const promptId = mobileMoveTarget.id;
                setPrompts(prompts.filter(p => p.id !== promptId));
                setMobileMoveTarget(null);

                const { error } = await supabase
                    .from('prompts')
                    .update({ category_id: targetCatId })
                    .eq('id', promptId);

                if (error) {
                    alert('Error moving prompt: ' + error.message);
                    fetchPrompts(activeCategoryId);
                }
            }


            return (
                <div className="flex flex-col md:flex-row gap-4">
                    {/* Categories Sidebar */}
                    <div className="w-full md:w-1/4 bg-gray-800 p-4 rounded-lg shadow border border-gray-700 flex-shrink-0 md:h-auto">
                        <h3 className="font-bold mb-2 text-gray-200">Categories</h3>
                        <p className="hidden md:block text-xs text-gray-400 mb-2">Drag prompts here to move them.</p>
                        <div className="flex flex-wrap gap-2">
                            {categories.map(cat => {
                                const isPending = cat.name === '待定' || cat.name === 'Pending';
                                const isTrash = cat.name === '刪除' || cat.name === 'Trash' || cat.name === '垃圾桶';

                                let baseClasses = "px-3 py-1.5 rounded-full text-sm font-medium transition-colors border cursor-pointer select-none";
                                let activeClasses = "";
                                let inactiveClasses = "";

                                if (isTrash) {
                                    activeClasses = "bg-red-900 text-red-100 border-red-700 ring-2 ring-red-500";
                                    inactiveClasses = "bg-red-900/40 text-red-200 border-red-800 hover:bg-red-900/60";
                                } else if (isPending) {
                                    activeClasses = "bg-gray-600 text-gray-100 border-gray-500 ring-2 ring-gray-400";
                                    inactiveClasses = "bg-gray-700 text-gray-300 border-gray-600 hover:bg-gray-600";
                                } else {
                                    activeClasses = "bg-blue-600 text-blue-50 border-blue-500 ring-2 ring-blue-400";
                                    inactiveClasses = "bg-gray-700 text-gray-300 border-gray-600 hover:bg-gray-600";
                                }

                                return (
                                    <div
                                        key={cat.id}
                                        onClick={() => setActiveCategoryId(cat.id)}
                                        onDragOver={handleDragOver}
                                        onDrop={(e) => handleDrop(e, cat.id)}
                                        className={`${baseClasses} ${
                                            activeCategoryId === cat.id ? activeClasses : inactiveClasses
                                        } ${draggedPrompt && draggedPrompt.category_id !== cat.id ? 'border-dashed border-2 border-blue-400' : ''}`}
                                    >
                                        {cat.name}
                                    </div>
                                );
                            })}
                            {categories.length === 0 && <p className="text-sm text-gray-500">No categories.</p>}
                        </div>
                    </div>

                    {/* Prompts Selection Area */}
                    <div className="w-full md:w-2/4 bg-gray-800 p-4 rounded-lg shadow border border-gray-700">
                        <h3 className="font-bold mb-2 text-gray-200 flex justify-between items-center border-b border-gray-700 pb-2">
                            <span>{activeCategoryId ? categories.find(c => c.id === activeCategoryId)?.name : 'Select a Category'}</span>
                            {activeCategoryId && (categories.find(c => c.id === activeCategoryId)?.name === '刪除' || categories.find(c => c.id === activeCategoryId)?.name === '垃圾桶') && (
                                <button
                                    onClick={async () => {
                                        if(confirm("Empty Trash? This will permanently delete all prompts in this category.")) {
                                            const { error } = await supabase.from('prompts').delete().eq('category_id', activeCategoryId);
                                            if(!error) setPrompts([]);
                                        }
                                    }}
                                    className="text-xs bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700"
                                >
                                    Empty Trash
                                </button>
                            )}
                        </h3>
                        <div className="flex flex-wrap gap-2 pt-2">
                            {prompts.map(p => (
                                <div key={p.id} className="relative group flex items-center">
                                    <button
                                        onClick={() => addPrompt(p.content)}
                                        onContextMenu={(e) => openMobileMove(e, p)}
                                        draggable="true"
                                        onDragStart={(e) => handleDragStart(e, p)}
                                        title="Right click (or long press) to move"
                                        className={`bg-gray-700 hover:bg-gray-600 border ${p.is_pinned ? 'border-yellow-500 ring-1 ring-yellow-500/50' : 'border-gray-600'} hover:border-gray-500 text-gray-200 px-3 py-2 pr-8 rounded text-sm transition-colors text-left cursor-grab active:cursor-grabbing select-none relative`}
                                    >
                                        {p.content}
                                        <div
                                            onClick={(e) => togglePin(e, p)}
                                            className={`absolute right-1 top-1/2 -translate-y-1/2 p-1 rounded-full hover:bg-gray-500 transition-colors ${p.is_pinned ? 'text-yellow-400' : 'text-gray-400 opacity-0 group-hover:opacity-100'}`}
                                            title={p.is_pinned ? "Unpin" : "Pin to top"}
                                        >
                                            <Icons.Pin size={12} fill={p.is_pinned ? "currentColor" : "none"} />
                                        </div>
                                    </button>
                                </div>
                            ))}
                            {activeCategoryId && prompts.length === 0 && (
                                <p className="text-gray-500 italic">No prompts in this category.</p>
                            )}
                            {!activeCategoryId && (
                                <p className="text-gray-500 italic">Select a category to view prompts.</p>
                            )}
                        </div>
                    </div>

                    {/* Mobile Move Modal */}
                    {mobileMoveTarget && (
                        <div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4" onClick={() => setMobileMoveTarget(null)}>
                            <div className="bg-gray-800 border border-gray-700 rounded-lg shadow-xl max-w-sm w-full p-4 overflow-y-auto max-h-[80vh]" onClick={e => e.stopPropagation()}>
                                <h3 className="font-bold text-lg mb-4 text-gray-100">Move Prompt</h3>
                                <p className="text-gray-300 mb-4 text-sm break-words">"{mobileMoveTarget.content}"</p>
                                <div className="space-y-2">
                                    {categories.filter(c => c.id !== mobileMoveTarget.category_id).map(cat => (
                                        <button
                                            key={cat.id}
                                            onClick={() => confirmMobileMove(cat.id)}
                                            className="w-full text-left px-4 py-3 rounded bg-gray-700 hover:bg-gray-600 border border-gray-600 font-medium text-gray-200"
                                        >
                                            Move to {cat.name}
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => setMobileMoveTarget(null)} className="mt-4 w-full py-2 text-gray-400 hover:bg-gray-700 rounded">Cancel</button>
                            </div>
                        </div>
                    )}

                    <OutputPanel
                        selectedPrompts={selectedPrompts}
                        removeSelected={removeSelected}
                        clearAll={clearAll}
                        copyToClipboard={copyToClipboard}
                        copySuccess={copySuccess}
                    />
                </div>
            );
        }

        // --- Main App ---
        function App() {
            const [categories, setCategories] = useState([]);
            const [activeTab, setActiveTab] = useState('builder'); // builder, manage, import, settings
            const [supabase, setSupabase] = useState(null);
            const [config, setConfig] = useState({
                url: localStorage.getItem('supabase_url') || 'https://wkiaejynwautobjumwpq.supabase.co',
                key: localStorage.getItem('supabase_key') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndraWFlanlud2F1dG9ianVtd3BxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0NDYzMTYsImV4cCI6MjA4NDAyMjMxNn0.5lcx7xK4M-Zm5G2HJrCw7sZ-4-lb3y6vuZZFnT7VKFs'
            });

            // Shared State
            const [selectedPrompts, setSelectedPrompts] = useState([]);
            const [copySuccess, setCopySuccess] = useState(false);

            function addPrompt(text) {
                // Split incoming text by comma if it looks like a list? Or just append?
                // The user request says "add directly to output".
                // If text is a template string "a, b, c", we might want to split or just add.
                // Current builder adds individual items. Let's just push the text.
                if(!text) return;
                setSelectedPrompts([...selectedPrompts, text]);
            }

            function removeSelected(index) {
                const newPrompts = [...selectedPrompts];
                newPrompts.splice(index, 1);
                setSelectedPrompts(newPrompts);
            }

            function clearAll() {
                setSelectedPrompts([]);
            }

            function copyToClipboard() {
                const text = selectedPrompts.join(', ');
                navigator.clipboard.writeText(text).then(() => {
                    setCopySuccess(true);
                    setTimeout(() => setCopySuccess(false), 2000);
                });
            }

            useEffect(() => {
                if (config.url && config.key) {
                    try {
                        const client = createClient(config.url, config.key);
                        setSupabase(client);
                    } catch (e) {
                        console.error("Invalid Supabase config", e);
                    }
                }
            }, []);

            useEffect(() => {
                if (supabase) {
                    fetchCategories();
                }
            }, [supabase]);

            async function fetchCategories() {
                if (!supabase) return;
                const { data, error } = await supabase
                    .from('categories')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (error) {
                    console.error('Error fetching categories:', error);
                } else if (data) {
                    setCategories(data);

                    const defaultCats = ["待定", "刪除"];
                    let createdAny = false;

                    for (const name of defaultCats) {
                        if (!data.find(c => c.name === name)) {
                            await supabase.from('categories').insert([{ name }]);
                            createdAny = true;
                        }
                    }

                    if (createdAny) {
                        const { data: newData } = await supabase.from('categories').select('*').order('created_at', { ascending: true });
                        if(newData) setCategories(newData);
                    }
                }
            }

            const saveConfig = () => {
                localStorage.setItem('supabase_url', config.url);
                localStorage.setItem('supabase_key', config.key);
                try {
                    const client = createClient(config.url, config.key);
                    setSupabase(client);
                    alert("Configuration saved!");
                    window.location.reload();
                } catch (e) {
                    alert("Invalid Configuration");
                }
            };

            if (!supabase) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-900">
                        <div className="bg-gray-800 p-8 rounded-lg shadow-lg max-w-md w-full border border-gray-700 text-gray-100">
                            <h1 className="text-2xl font-bold mb-6 text-center text-blue-500 flex items-center justify-center gap-2">
                                <Icons.Layers /> Setup Supabase
                            </h1>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-300 mb-1">Supabase Project URL</label>
                                    <input
                                        type="text"
                                        value={config.url}
                                        onChange={(e) => setConfig({...config, url: e.target.value})}
                                        className="w-full p-2 border border-gray-600 bg-gray-700 rounded focus:ring-2 focus:ring-blue-500 outline-none text-gray-100"
                                        placeholder="https://xyz.supabase.co"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-300 mb-1">Supabase Anon Key</label>
                                    <input
                                        type="text"
                                        value={config.key}
                                        onChange={(e) => setConfig({...config, key: e.target.value})}
                                        className="w-full p-2 border border-gray-600 bg-gray-700 rounded focus:ring-2 focus:ring-blue-500 outline-none text-gray-100"
                                        placeholder="eyJhbGciOiJIUzI1NiIsIn..."
                                    />
                                </div>
                                <button
                                    onClick={saveConfig}
                                    className="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700 transition-colors"
                                >
                                    Connect & Start
                                </button>
                                <p className="text-xs text-gray-500 text-center mt-4">
                                    Your keys are stored locally in your browser.
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-900 text-gray-100 font-sans">
                    <header className="bg-gray-800 shadow p-2 mb-4 sticky top-0 z-10 border-b border-gray-700">
                        <div className="max-w-7xl mx-auto flex justify-between items-center flex-wrap gap-2">
                            {/* Title removed as requested */}
                            <div className="flex-1"></div>
                            <nav className="flex gap-2">
                                <button
                                    onClick={() => setActiveTab('builder')}
                                    className={`px-2 py-1 text-xs sm:text-sm rounded flex items-center gap-1 transition-colors ${activeTab === 'builder' ? 'bg-blue-600 text-white' : 'hover:bg-gray-700 text-gray-300'}`}
                                >
                                    <Icons.PenTool size={14} /> Builder
                                </button>
                                <button
                                    onClick={() => setActiveTab('gallery')}
                                    className={`px-2 py-1 text-xs sm:text-sm rounded flex items-center gap-1 transition-colors ${activeTab === 'gallery' ? 'bg-blue-600 text-white' : 'hover:bg-gray-700 text-gray-300'}`}
                                >
                                    <Icons.Grid size={14} /> Gallery
                                </button>
                                <button
                                    onClick={() => setActiveTab('import')}
                                    className={`px-2 py-1 text-xs sm:text-sm rounded flex items-center gap-1 transition-colors ${activeTab === 'import' ? 'bg-blue-600 text-white' : 'hover:bg-gray-700 text-gray-300'}`}
                                >
                                    <Icons.Database size={14} /> Bulk Import
                                </button>
                                <button
                                    onClick={() => setActiveTab('manage')}
                                    className={`px-2 py-1 text-xs sm:text-sm rounded flex items-center gap-1 transition-colors ${activeTab === 'manage' ? 'bg-blue-600 text-white' : 'hover:bg-gray-700 text-gray-300'}`}
                                >
                                    <Icons.Layers size={14} /> Categories
                                </button>
                                <button
                                    onClick={() => {
                                        if(confirm("Reset credentials?")) {
                                            localStorage.removeItem('supabase_url');
                                            localStorage.removeItem('supabase_key');
                                            window.location.reload();
                                        }
                                    }}
                                    className="px-2 py-1 rounded flex items-center gap-1 hover:bg-red-900/50 text-red-400 transition-colors ml-2"
                                    title="Reset Config"
                                >
                                    <Icons.Settings size={14} />
                                </button>
                            </nav>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 pb-10">
                        {activeTab === 'builder' && (
                            <PromptBuilder
                                supabase={supabase}
                                categories={categories}
                                selectedPrompts={selectedPrompts}
                                addPrompt={addPrompt}
                                removeSelected={removeSelected}
                                clearAll={clearAll}
                                copyToClipboard={copyToClipboard}
                                copySuccess={copySuccess}
                            />
                        )}

                        {activeTab === 'gallery' && (
                            <div className="flex flex-col md:flex-row gap-4">
                                <TemplateGallery supabase={supabase} onAddPrompt={addPrompt} />
                                <OutputPanel
                                    selectedPrompts={selectedPrompts}
                                    removeSelected={removeSelected}
                                    clearAll={clearAll}
                                    copyToClipboard={copyToClipboard}
                                    copySuccess={copySuccess}
                                />
                            </div>
                        )}

                        {activeTab === 'import' && (
                            <BulkImporter supabase={supabase} categories={categories} onImportComplete={fetchCategories} />
                        )}

                        {activeTab === 'manage' && (
                            <CategoryManager supabase={supabase} onCategoriesChange={fetchCategories} />
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
